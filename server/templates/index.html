<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Body Double</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #fff;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      background: #1a1a1a;
      color: #4b5563;
      border: 1px solid #222;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge.focus { background: #0f2040; color: #60a5fa; border-color: #1e3a5f; }
    .badge.nudge { background: #2a1e00; color: #fbbf24; border-color: #3a2a00; }

    .card {
      background: #111;
      border: 1px solid #1f1f1f;
      border-radius: 10px;
      padding: 18px 20px;
    }

    .card-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: #4b5563;
      margin-bottom: 14px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
    }

    .mode-btn {
      padding: 10px 0;
      border-radius: 7px;
      border: 1px solid #1f1f1f;
      background: transparent;
      color: #4b5563;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
    }
    .mode-btn:hover { border-color: #333; color: #9ca3af; }
    .mode-btn.active[data-mode="focus"] { background: #0f2040; border-color: #1d4ed8; color: #60a5fa; }
    .mode-btn.active[data-mode="nudge"] { background: #2a1e00; border-color: #92400e; color: #fbbf24; }
    .mode-btn.active[data-mode="off"]   { background: #1a1a1a; border-color: #333; color: #e5e5e5; }

    .session-line {
      margin-top: 12px;
      font-size: 0.78rem;
      color: #4b5563;
      min-height: 18px;
    }
    .session-line a { color: #4b5563; text-decoration: underline; cursor: pointer; }
    .session-line strong { color: #6b7280; }

    .project-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    select, input[type="text"] {
      background: #0a0a0a;
      border: 1px solid #1f1f1f;
      color: #e5e5e5;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.12s;
    }
    select:focus, input:focus { border-color: #3b82f6; }
    select { flex: 1; cursor: pointer; }

    .btn {
      padding: 8px 13px;
      border-radius: 6px;
      border: 1px solid #1f1f1f;
      background: #181818;
      color: #9ca3af;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .btn:hover { border-color: #333; color: #e5e5e5; background: #222; }

    .section-label {
      font-size: 0.75rem;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .divider { height: 1px; background: #1a1a1a; margin: 16px 0; }

    .domain-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .domain-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      font-size: 0.83rem;
      color: #9ca3af;
    }

    .domain-item .entry-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .entry-type {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .entry-type.domain { background: #0f2a1a; color: #4ade80; border: 1px solid #1a3a25; }
    .entry-type.page   { background: #1a1535; color: #a78bfa; border: 1px solid #2a2050; }

    .remove-btn {
      background: none;
      border: none;
      color: #374151;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 2px;
      transition: color 0.1s;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: #ef4444; }

    .add-row { display: flex; gap: 8px; }
    .add-row input { flex: 1; }

    .empty { font-size: 0.78rem; color: #374151; padding: 4px 0; }

    /* Scope dialog */
    .scope-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .scope-overlay.open { display: flex; }

    .scope-modal {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
    }

    .scope-modal .modal-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #4b5563;
      margin-bottom: 6px;
    }

    .scope-modal .modal-url {
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 20px;
      word-break: break-all;
      line-height: 1.5;
    }

    .scope-modal .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scope-modal .modal-btn {
      padding: 10px 14px;
      border-radius: 7px;
      border: 1px solid #1f1f1f;
      background: #181818;
      color: #9ca3af;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s;
    }
    .scope-modal .modal-btn:hover { border-color: #333; color: #e5e5e5; background: #222; }
    .scope-modal .modal-btn.primary { border-color: #1e3a5f; background: #0f2040; color: #60a5fa; }
    .scope-modal .modal-btn.primary:hover { background: #162b55; }
    .scope-modal .modal-btn.cancel { color: #374151; }

    .scope-modal .modal-btn .btn-title { font-weight: 500; }
    .scope-modal .modal-btn .btn-sub {
      font-size: 0.75rem;
      color: #4b5563;
      margin-top: 2px;
    }
    .scope-modal .modal-btn.primary .btn-sub { color: #3b82f6; }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>Body Double</h1>
      <span class="badge" id="badge">Off</span>
    </div>

    <!-- Mode -->
    <div class="card">
      <div class="card-label">Mode</div>
      <div class="mode-grid">
        <button class="mode-btn" data-mode="focus" onclick="setMode('focus')">Focus</button>
        <button class="mode-btn" data-mode="nudge" onclick="setMode('nudge')">Nudge</button>
        <button class="mode-btn active" data-mode="off"   onclick="setMode('off')">Off</button>
      </div>
      <div class="session-line" id="session-line"></div>
    </div>

    <!-- Project -->
    <div class="card">
      <div class="card-label">Project</div>
      <div class="project-row">
        <select id="project-select" onchange="onProjectChange()">
          <option value="">— select project —</option>
        </select>
        <button class="btn" onclick="newProject()">+ New</button>
        <button class="btn" id="delete-project-btn" onclick="deleteProject()" style="display:none;color:#ef4444;border-color:#3a1a1a;">Delete</button>
      </div>

      <div class="section-label">Local whitelist</div>
      <div class="domain-list" id="local-list"></div>
      <div class="add-row">
        <input type="text" id="local-input" placeholder="e.g. docs.python.org or a full URL"
               onkeydown="if(event.key==='Enter') addLocal()">
        <button class="btn" onclick="addLocal()">Add</button>
      </div>
    </div>

    <!-- Global Whitelist -->
    <div class="card">
      <div class="card-label">Global Whitelist</div>
      <div class="section-label">Allowed on all projects</div>
      <div class="domain-list" id="global-list"></div>
      <div class="add-row">
        <input type="text" id="global-input" placeholder="e.g. stackoverflow.com or a full URL"
               onkeydown="if(event.key==='Enter') addGlobal()">
        <button class="btn" onclick="addGlobal()">Add</button>
      </div>
    </div>

  </div>

  <!-- Scope dialog -->
  <div class="scope-overlay" id="scope-overlay">
    <div class="scope-modal">
      <div class="modal-label">Allow access to</div>
      <div class="modal-url" id="scope-url"></div>
      <div class="modal-actions">
        <button class="modal-btn primary" id="scope-domain-btn">
          <div class="btn-title" id="scope-domain-label">All of this domain</div>
          <div class="btn-sub">Allow every page on this site</div>
        </button>
        <button class="modal-btn" id="scope-page-btn">
          <div class="btn-title">This page only</div>
          <div class="btn-sub" id="scope-page-sub">Only allow this specific URL</div>
        </button>
        <button class="modal-btn cancel" id="scope-cancel-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:8000';

    const state = {
      projects: [],
      selectedId: null,
      session: null,
      globalWhitelist: [],
      activeMode: 'off',
    };

    async function init() {
      const [projects, session, config] = await Promise.all([
        fetch(`${API}/projects`).then(r => r.json()),
        fetch(`${API}/session/status`).then(r => r.json()),
        fetch(`${API}/config/whitelist`).then(r => r.json()),
      ]);
      state.projects = projects;
      state.session = session;
      state.globalWhitelist = config.domains;
      if (session.active) {
        state.selectedId = session.project_id;
        state.activeMode = session.mode;
      }
      render();
    }

    function render() {
      renderProjectSelect();
      renderModeButtons();
      renderBadge();
      renderSessionLine();
      renderLocalList();
      renderGlobalList();
    }

    function renderProjectSelect() {
      const sel = document.getElementById('project-select');
      sel.innerHTML = '<option value="">— select project —</option>';
      state.projects.forEach(p => {
        const o = document.createElement('option');
        o.value = p.id;
        o.textContent = p.name;
        if (p.id === state.selectedId) o.selected = true;
        sel.appendChild(o);
      });
    }

    function renderModeButtons() {
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === state.activeMode);
      });
    }

    function renderBadge() {
      const b = document.getElementById('badge');
      b.className = 'badge';
      if (state.session?.active) {
        b.classList.add(state.session.mode);
        b.textContent = state.session.mode.toUpperCase();
      } else {
        b.textContent = 'OFF';
      }
    }

    function renderSessionLine() {
      const el = document.getElementById('session-line');
      if (state.session?.active) {
        const t = new Date(state.session.started_at * 1000).toLocaleTimeString();
        el.innerHTML = `Active since <strong>${t}</strong> &mdash; <a onclick="setMode('off')">end session</a>`;
      } else {
        el.textContent = '';
      }
    }

    function renderLocalList() {
      const list = document.getElementById('local-list');
      const project = state.projects.find(p => p.id === state.selectedId);
      const entries = project?.whitelist ?? [];
      list.innerHTML = '';
      if (!entries.length) { list.innerHTML = '<div class="empty">No entries added</div>'; return; }
      entries.forEach(e => list.appendChild(entryItem(e, () => removeLocal(e))));
    }

    function renderGlobalList() {
      const list = document.getElementById('global-list');
      list.innerHTML = '';
      if (!state.globalWhitelist.length) { list.innerHTML = '<div class="empty">No entries added</div>'; return; }
      state.globalWhitelist.forEach(e => list.appendChild(entryItem(e, () => removeGlobal(e))));
    }

    function entryItem(entry, onRemove) {
      const isPage = entry.includes('://');
      const el = document.createElement('div');
      el.className = 'domain-item';
      el.innerHTML = `
        <span class="entry-text" title="${entry}">${entry}</span>
        <span class="entry-type ${isPage ? 'page' : 'domain'}">${isPage ? 'page' : 'domain'}</span>
        <button class="remove-btn" title="Remove">&times;</button>
      `;
      el.querySelector('button').onclick = onRemove;
      return el;
    }

    async function setMode(mode) {
      state.activeMode = mode;
      renderModeButtons();

      if (mode === 'off') {
        await fetch(`${API}/session/end`, { method: 'POST' });
        state.session = { active: false };
        renderBadge();
        renderSessionLine();
        return;
      }

      const id = parseInt(document.getElementById('project-select').value);
      if (!id) { alert('Select a project first.'); state.activeMode = state.session?.mode ?? 'off'; renderModeButtons(); return; }

      await fetch(`${API}/session/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project_id: id, mode }),
      });
      state.session = await fetch(`${API}/session/status`).then(r => r.json());
      renderBadge();
      renderSessionLine();
    }

    function onProjectChange() {
      const val = document.getElementById('project-select').value;
      state.selectedId = val ? parseInt(val) : null;
      document.getElementById('delete-project-btn').style.display = state.selectedId ? '' : 'none';
      renderLocalList();
    }

    async function deleteProject() {
      if (!state.selectedId) return;
      const project = state.projects.find(p => p.id === state.selectedId);
      if (!confirm(`Delete "${project?.name}"?`)) return;
      await fetch(`${API}/projects/${state.selectedId}`, { method: 'DELETE' });
      state.projects = state.projects.filter(p => p.id !== state.selectedId);
      state.selectedId = null;
      document.getElementById('delete-project-btn').style.display = 'none';
      renderProjectSelect();
      renderLocalList();
    }

    async function newProject() {
      const name = prompt('Project name:');
      if (!name?.trim()) return;
      const p = await fetch(`${API}/projects`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.trim() }),
      }).then(r => r.json());
      state.projects.push(p);
      state.selectedId = p.id;
      renderProjectSelect();
      renderLocalList();
    }

    // Resolve a raw input to either a domain string or a full URL string.
    // If the input has a path, shows a dialog to let the user choose.
    // Returns a Promise resolving to the entry string, or null if cancelled.
    function resolveScope(raw) {
      let urlStr = raw.trim();
      if (!/^https?:\/\//i.test(urlStr)) urlStr = 'https://' + urlStr;
      try {
        const parsed = new URL(urlStr);
        const domain = parsed.hostname;
        const hasPath = parsed.pathname.length > 1 || parsed.search !== '' || parsed.hash !== '';
        // Normalize: remove trailing slash, keep query and hash
        const fullUrl = parsed.href.replace(/\/$/, '');
        if (!hasPath) return Promise.resolve(domain);
        return new Promise(resolve => showScopeDialog(fullUrl, domain, resolve));
      } catch {
        // Not parseable as URL — treat as a raw domain/substring entry
        return Promise.resolve(raw.trim().toLowerCase());
      }
    }

    function showScopeDialog(fullUrl, domain, resolve) {
      document.getElementById('scope-url').textContent = fullUrl;
      document.getElementById('scope-domain-label').textContent = `All of ${domain}`;
      document.getElementById('scope-page-sub').textContent = fullUrl;

      const overlay = document.getElementById('scope-overlay');
      overlay.classList.add('open');

      const domainBtn = document.getElementById('scope-domain-btn');
      const pageBtn   = document.getElementById('scope-page-btn');
      const cancelBtn = document.getElementById('scope-cancel-btn');

      const done = (value) => {
        overlay.classList.remove('open');
        // Remove listeners to prevent stacking
        domainBtn.onclick = null;
        pageBtn.onclick   = null;
        cancelBtn.onclick = null;
        resolve(value);
      };

      domainBtn.onclick = () => done(domain);
      pageBtn.onclick   = () => done(fullUrl);
      cancelBtn.onclick = () => done(null);
    }

    async function addLocal() {
      const input = document.getElementById('local-input');
      const raw = input.value.trim();
      if (!raw || !state.selectedId) return;
      const entry = await resolveScope(raw);
      if (!entry) return;
      const project = state.projects.find(p => p.id === state.selectedId);
      if (!project || project.whitelist.includes(entry)) return;
      project.whitelist.push(entry);
      await saveLocal(project);
      input.value = '';
      renderLocalList();
    }

    async function removeLocal(entry) {
      const project = state.projects.find(p => p.id === state.selectedId);
      if (!project) return;
      project.whitelist = project.whitelist.filter(e => e !== entry);
      await saveLocal(project);
      renderLocalList();
    }

    async function saveLocal(project) {
      await fetch(`${API}/projects/${project.id}/whitelist`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domains: project.whitelist }),
      });
    }

    async function addGlobal() {
      const input = document.getElementById('global-input');
      const raw = input.value.trim();
      if (!raw) return;
      const entry = await resolveScope(raw);
      if (!entry) return;
      if (state.globalWhitelist.includes(entry)) return;
      state.globalWhitelist.push(entry);
      await saveGlobal();
      input.value = '';
      renderGlobalList();
    }

    async function removeGlobal(entry) {
      state.globalWhitelist = state.globalWhitelist.filter(e => e !== entry);
      await saveGlobal();
      renderGlobalList();
    }

    async function saveGlobal() {
      await fetch(`${API}/config/whitelist`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ domains: state.globalWhitelist }),
      });
    }

    init();
  </script>
</body>
</html>
